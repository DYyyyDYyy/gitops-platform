apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "api.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "api.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.dbSecret }}, key: DATABASE_URL } }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "restricted.container" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.dbSecret }}, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "restricted.container" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  selector: {{- include "api.selector" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: transport-api, port: { name: http } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: transport-api }
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.hpa.cpuUtilization }} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "api.selector" . | nindent 6 }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transport-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "api.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
