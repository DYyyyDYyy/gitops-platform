apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transport-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "db.selector" . | nindent 4 }}
spec:
  serviceName: transport-db
  replicas: 1
  selector:
    matchLabels: {{- include "db.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "db.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: pg, containerPort: 5432 }
          envFrom:
            - secretRef: { name: {{ .Values.dbSecret }} }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER"'] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "restricted.container" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: transport-db
  namespace: {{ .Release.Namespace }}
  labels: {{- include "db.selector" . | nindent 4 }}
spec:
  selector: {{- include "db.selector" . | nindent 4 }}
  ports:
    - { name: pg, port: 5432, targetPort: pg }
