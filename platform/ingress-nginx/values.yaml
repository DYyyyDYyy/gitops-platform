# kind: controller on the control-plane node, bound to host ports 80/443 (see terraform extra_port_mappings).
controller:
  hostPort:
    enabled: true
  service:
    type: NodePort
  nodeSelector:
    ingress-ready: "true"
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  ingressClassResource:
    default: true
  publishService:
    enabled: false
  extraArgs:
    publish-status-address: localhost
  updateStrategy:
    type: Recreate # hostPort cannot be shared during rolling update
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
  admissionWebhooks:
    enabled: false # fewer moving parts locally; Argo CD validates via dry-run
