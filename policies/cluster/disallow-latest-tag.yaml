apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: Images must have an explicit tag other than latest.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # only namespaces opted in by Terraform (apps); platform charts are not ours to police
    namespaceSelector:
      matchLabels:
        policy.platform.local/enforce: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        (object.kind == 'Pod' ? object.spec : object.spec.template.spec)
    - name: containers
      expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@') ||
        (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') && !c.image.endsWith(':latest')))
      message: "Image must be pinned to a tag other than 'latest' (or a digest)."
