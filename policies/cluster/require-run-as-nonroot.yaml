apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/description: Pods must run as non-root.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # only namespaces opted in by Terraform (apps); platform charts are not ours to police
    namespaceSelector:
      matchLabels:
        policy.platform.local/enforce: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        (object.kind == 'Pod' ? object.spec : object.spec.template.spec)
    - name: containers
      expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
        c.?securityContext.?runAsNonRoot.orValue(variables.podSpec.?securityContext.?runAsNonRoot.orValue(false)) == true)
      message: "runAsNonRoot must be true (pod or container securityContext)."
